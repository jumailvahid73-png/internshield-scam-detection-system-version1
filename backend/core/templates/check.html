{% extends "base.html" %}

{% block content %}

<div class="bg-white/10 backdrop-blur-lg p-10 rounded-2xl shadow-2xl border border-white/10">

    <h2 class="text-3xl font-bold mb-8 text-center">Scam Detection System</h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <input type="text" name="title" placeholder="Internship Title"
               class="w-full p-4 rounded-lg bg-white/20 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <textarea name="description" placeholder="Internship Description"
                  class="w-full p-4 rounded-lg bg-white/20 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 h-28"></textarea>

        <input type="email" name="email" placeholder="Contact Email"
               class="w-full p-4 rounded-lg bg-white/20 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <input type="number" name="stipend" placeholder="Stipend (Optional)"
               class="w-full p-4 rounded-lg bg-white/20 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <button type="submit"
                class="w-full py-4 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition duration-300 shadow-lg">
            Analyze Internship
        </button>
    </form>

</div>

{% endblock %}
